<style>
/* Il primo fotogramma: il benvenuto con la stessa fiamma dell'immagine di avvio, alla stessa misura e nello stesso
   punto, cosi' tra l'icona toccata e l'app non c'e' mai uno schermo vuoto. Sta qui e non in app.css per esserci subito.
   E' sempre scuro, anche con l'aspetto chiaro: e' la copertina dell'app. */
html { background: #090a0d; color-scheme: dark; }
html[data-tema="chiaro"] { background: #f2f3f6; color-scheme: light; }
body { margin: 0; }
#benvenuto { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #090a0d; color: #f4f5f7;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  border-radius: 0 0 34px 34px; transition: transform .6s cubic-bezier(.76, 0, .24, 1); will-change: transform; }
#benvenuto svg { display: block; width: min(34vw, 190px); height: min(34vw, 190px); }
#benvenuto .ciao { position: absolute; left: 24px; right: 24px; top: calc(50% + min(17vw, 95px) + 16px); text-align: center;
  opacity: 0; transform: translateY(10px); animation: ben-su .5s .12s cubic-bezier(.2, .8, .2, 1) forwards; }
#benvenuto small { display: block; font-size: 15px; font-weight: 600; color: #8d93a3; letter-spacing: .01em; }
#benvenuto .ciao b { display: block; margin-top: 2px; font-size: 32px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#benvenuto .firma { position: absolute; left: 24px; right: 24px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); text-align: center;
  font-size: 11.5px; line-height: 1.5; color: #6d7282; font-weight: 500; opacity: 0; animation: ben-su .6s .3s cubic-bezier(.2, .8, .2, 1) forwards; }
#benvenuto .firma strong { display: block; margin-bottom: 4px; font-size: 17px; font-weight: 800; letter-spacing: -.02em; color: #f4f5f7; }
#benvenuto .firma strong i { font-style: normal; color: #c8ff4d; }
#benvenuto .firma u { text-decoration: none; color: #a6abb8; font-weight: 650; }
#benvenuto.via { transform: translateY(-102%); }
@keyframes ben-su { to { opacity: 1; transform: none; } }
</style>

<body>
<div id="benvenuto" aria-hidden="true">
  <!-- gli stessi tracciati di tools/make_icons.py: la fiamma, con la goccia scavata dentro -->
  <svg viewBox="0 0 100 100">
    <defs><linearGradient id="ben-g" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#d6ff5c"/><stop offset="1" stop-color="#4df0a0"/></linearGradient></defs>
    <path fill="url(#ben-g)" fill-rule="evenodd" d="M53 5C55 22 78 33 78 58C78 77 65 93 50 93C35 93 22 78 22 61C22 49 28 39 37 31C38 41 42 47 48 48C43 34 46 17 53 5ZM50 84C42 84 36.5 78 36.5 70.5C36.5 62 44 58.5 47.5 50C50 58 63.5 62 63.5 72.5C63.5 79.5 57.5 84 50 84Z"/>
  </svg>
  <div class="ciao"><small id="ben-saluto"></small><b id="ben-nome"></b></div>
  <div class="firma"><strong>Ever<i>Fit</i></strong>Interamente sviluppata da <u>DIEFFE di Daniele Fortunio</u><br>&copy; 2026 &middot; Tutti i diritti riservati</div>
</div>
<script>
// Il saluto si scrive subito, prima che arrivi il resto dell'app: il nome sta in memoria (fit.io) o nel cookie fitn.
(function () {
  var io = {}, nome = '', dopoAggiornamento = 0;
  try { io = JSON.parse(localStorage.getItem('fit.io') || '{}') || {}; } catch (e) {}
  nome = io.nome || '';
  if (!nome) { var m = /(?:^|; )fitn=([^;]*)/.exec(document.cookie); if (m) { try { nome = decodeURIComponent(m[1]); } catch (e) {} } }
  // al primo ingresso non si sa ancora se e' un uomo o una donna: "Ciao" va bene per tutti
  document.getElementById('ben-saluto').textContent = !io.id ? (nome ? 'Ciao' : 'Benvenuto in EverFit') : io.sesso === 'f' ? 'Bentornata' : 'Bentornato';
  document.getElementById('ben-nome').textContent = nome;
  // se la pagina si e' appena ricaricata da sola per prendere una versione nuova, il saluto non si ripete per intero
  try { dopoAggiornamento = Number(sessionStorage.getItem('fit.ricarica') || 0); } catch (e) {}
  window.fitAvvio = Date.now() - (Date.now() - dopoAggiornamento < 8000 ? 900 : 0);
  // ...anzi non si ripete affatto: il benvenuto si e' gia' visto un attimo fa, rivederlo sembra un difetto
  if (Date.now() - dopoAggiornamento < 8000) { var gia = document.getElementById('benvenuto'); if (gia) gia.parentNode.removeChild(gia); }
})();
</script>
<script>
// Su iPhone, aperta dalla Home, la finestra che il sistema da' alla pagina e' piu' bassa dello schermo di quanto e' alta
// la fascia dell'orologio: tutto quello che sta "in fondo" resta sollevato e sotto avanza una striscia vuota.
// Qui si misura quanto manca e lo si dice al CSS (html.alta e --schermo, vedi "struttura" in app.css).
// Sta qui e non in main.js perche' deve valere dal primo fotogramma, benvenuto compreso.
(function () {
  var radice = document.documentElement;
  function misura() {
    // una volta corretta non si rimisura: con la correzione accesa la finestra non e' piu' quella di partenza
    if (navigator.standalone !== true || !document.body || radice.classList.contains('alta')) return;
    var verticale = !window.matchMedia || matchMedia('(orientation: portrait)').matches;
    var schermo = verticale ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    var manca = Math.round(schermo - document.body.getBoundingClientRect().height);
    window.fitSchermo = { schermo: schermo, manca: manca, corretto: manca >= 16 && manca <= 90 };
    // solo se manca una fascia grande come quella dell'orologio: una differenza diversa e' un'altra cosa, e non si tocca
    if (window.fitSchermo.corretto) { radice.style.setProperty('--schermo', schermo + 'px'); radice.classList.add('alta'); }
  }
  misura();
  // la finestra puo' assestarsi un attimo dopo l'apertura: finche' non c'e' niente da correggere si riprova
  window.addEventListener('load', misura);
  window.addEventListener('pageshow', misura);
  window.addEventListener('resize', misura);
  setTimeout(misura, 300); setTimeout(misura, 1200);
  // girando il telefono le misure cambiano: si toglie la correzione e si rimisura a rotazione finita
  window.addEventListener('orientationchange', function () { radice.classList.remove('alta'); setTimeout(misura, 500); });
})();
</script>
