# FitFuel: dieta e allenamento. Il reverse proxy lo raggiunge come fit:8080 sulla rete "proxy" (esterna: e' quella
# del proxy). I file dell'app sono montati in sola lettura: per aggiornarli basta ricopiarli, senza riavviare.
#
# Il servizio ollama (l'AI locale) e' facoltativo e puo' girare su un altro nodo: con Docker Swarm i due si parlano
# sulla rete overlay "ai". In quel caso ogni servizio si accende solo sul suo nodo ("up -d fit", "up -d ollama"): un
# "docker compose up -d" senza nome accenderebbe un doppione. deploy.sh non copia questo file e riavvia solo fit.
services:
  fit:
    image: python:3.12-slim
    container_name: fit
    restart: unless-stopped
    user: "1001:1001"
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # l'AI che gira sulla VM (servizio ollama qui sotto): ultima riserva dell'assistente, vedi server/cibo.py
      FIT_LOCALE_URL: "http://ollama:11434"
      FIT_MODELLO_LOCALE: "gemma4:e4b"   # scelto l'11/10/2026 dopo le prove sulla VM: 16 richieste giuste su 16
    # FIT_COOKIE e FIT_CODICE: accendono la richiesta del codice sull'indirizzo corto (server/accesso.py)
    env_file:
      - path: ./accesso.env
        required: false
    command: ["python", "-u", "server/server.py", "--root", "/app/public", "--data", "/data", "--port", "8080"]
    volumes:
      - ./public:/app/public:ro
      - ./server:/app/server:ro
      - ./data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    networks: [proxy, ai]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Un modello di AI che gira qui sulla VM, senza chiavi e senza limiti: risponde quando i servizi gratuiti dicono
  # basta. Niente porte aperte: lo raggiunge solo fit, sulla rete "ai" (gli altri container della VM non lo vedono).
  # Tre core su quattro e un tetto di memoria, cosi' mentre risponde il resto della VM continua a girare.
  # I modelli stanno in ./ollama e si scaricano a mano: sudo docker exec fit-ollama ollama pull <modello>
  ollama:
    image: ollama/ollama
    container_name: fit-ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "24h"        # resta in memoria: ricaricarlo fa perdere quello che ha gia' letto
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ./ollama:/root/.ollama
    cpus: 3.0
    mem_limit: 10g   # gemma4:e4b caricato ne occupa 7,3
    security_opt: ["no-new-privileges:true"]
    networks: [ai]

networks:
  proxy:
    external: true
  ai:
    external: true
    name: ai
