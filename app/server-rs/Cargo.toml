[package]
name = "fit-server"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false
license = "UNLICENSED"

[[bin]]
name = "fit"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-graceful"] }
http-body-util = "0.1.5"
bytes = "1"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
# ring instead of the default aws-lc-rs: no cmake/C toolchain needed for the static musl build
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
sha1 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
subtle = "2.6"
hex = "0.4"
base64 = "0.23"
rand = "0.10"
p256 = { version = "0.14", features = ["ecdsa", "getrandom"] }
jiff = { version = "0.2.43", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-always"] }
regex = "1.13"
url = "2.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json", "env-filter"] }

[dev-dependencies]
tempfile = "3.27"
