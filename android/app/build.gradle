// EverFit Android: a Trusted Web Activity that opens https://fit.everbright.it in Chrome.
// Generated by Bubblewrap 1.27.0 from ../twa-manifest.json and trimmed by hand, see ../README.md.

plugins {
    id 'com.android.application'
}

def host = 'fit.everbright.it'
// versionCode: CI passes -PversionCode=<commits on main>, strictly increasing and the same on a rerun
def appVersionCode = (project.findProperty('versionCode') ?: '1') as Integer
def appVersionName = rootProject.file('VERSION').text.trim()
// only the emulator test opens a local copy (-PlaunchOrigin=http://10.0.2.2:8080); releases open the site
def launchOrigin = project.findProperty('launchOrigin') ?: "https://${host}"
def background = '#090A0D'

android {
    namespace = 'it.alias_pv60kg.everfit'
    compileSdk = 37

    buildFeatures {
        resValues = true
    }

    defaultConfig {
        applicationId = 'it.alias_pv60kg.everfit'
        // TWA needs Chrome 72+, current Chrome needs Android 10; 24 lets older phones open the Custom Tab fallback
        minSdk = 24
        targetSdk = 37
        versionCode = appVersionCode
        versionName = appVersionName

        resValue 'string', 'appName', 'EverFit'
        resValue 'string', 'launcherName', 'EverFit'
        // ?apk=<versionCode> tells the web app (js/apk.js) which shell is installed
        resValue 'string', 'launchUrl', "${launchOrigin}/?apk=${appVersionCode}"
        resValue 'string', 'hostName', host
        resValue 'string', 'providerAuthority', 'it.alias_pv60kg.everfit.fileprovider'
        resValue 'string', 'generatorApp', 'bubblewrap-cli'
        resValue 'string', 'fallbackType', 'customtabs'
        resValue 'string', 'orientation', 'portrait'
        resValue 'integer', 'splashScreenFadeOutDuration', '300'
        resValue 'color', 'colorPrimary', background
        resValue 'color', 'colorPrimaryDark', background
        resValue 'color', 'navigationColor', background
        resValue 'color', 'navigationColorDark', background
        resValue 'color', 'navigationDividerColor', '#00000000'
        resValue 'color', 'navigationDividerColorDark', '#00000000'
        resValue 'color', 'backgroundColor', background
    }

    signingConfigs {
        release {
            // CI only: the keystore comes from secrets into a temp file, never into the repository
            def store = System.getenv('ANDROID_KEYSTORE_FILE')
            if (store) {
                storeFile = file(store)
                storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                keyPassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                enableV1Signing = false
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig = signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
        warningsAsErrors = true
        lintConfig = file('lint.xml')
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
