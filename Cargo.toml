[workspace]
members = ["app/server-rs"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

# panic stays "unwind": a panic inside one request or one FitAI job must not take the whole server down, as an
# exception in one request thread does not in the Python server (spawn_blocking and catch_unwind rely on unwinding)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
