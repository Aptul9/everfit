name: CI/CD

# Every pull request and push: tests, then the two images are built once, run with the production restrictions on
# demo data and smoke-tested. On main, only a commit that came from a merged pull request is deployed: the tested
# images travel to the VM with docker save/load and are started by tag after their config digests match. Nothing is
# built on the VM. The book corpus and the owner's story never enter this public repository, its images or its
# artifacts: the deploy job copies them from the private repository straight to the VM.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Tests and containers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Deployment tests
        run: |
          python -m unittest discover -s ci -p 'test_*.py'
          shellcheck -x --severity=warning ci/*.sh
      - name: Backend
        working-directory: backend
        run: |
          python -m pip install --quiet uv
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/.well-known/assetlinks.json
      - name: Build images
        run: |
          docker build --pull -t "everfit:$RELEASE" .
          docker build --pull -f Dockerfile.caddy -t "everfit-web:$RELEASE" .
          docker run --rm -e FIT_TLS=internal "everfit-web:$RELEASE" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Run the images with the compose restrictions (demo data, sign-in off)
        env:
          FIT_DOMINIO: fit.test
          FIT_TLS: internal
          NUTRI_SOURCE: demo
          NUTRI_AUTH: "off"
        run: |
          echo '127.0.0.1 fit.test' | sudo tee -a /etc/hosts
          export FIT_DATA_DIR=$(mktemp -d) FIT_PRIVATE_DIR=$(mktemp -d)
          sudo chown 10001:10001 "$FIT_DATA_DIR"
          sudo chmod 700 "$FIT_DATA_DIR"
          docker compose config --quiet
          trap 'docker compose logs --tail 60; docker compose down -v' EXIT
          docker compose up -d --wait --wait-timeout 180
          python ci/smoke.py --url https://fit.test:4450 --insecure --demo
          for service in app web; do
            container=$(docker compose ps -q "$service")
            docker inspect "$container" --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}} {{.Config.User}} {{.State.Health.Status}}' | tee inspect.txt
            grep -qx 'true \[ALL\] \[no-new-privileges:true\] 10001:10001 healthy' inspect.txt
          done
          # nothing may listen on a public interface: host network, loopback only
          if sudo ss -ltnH | awk '{print $4}' | grep -E '(^|:)(4450|4458|4459|8097)$' | grep -v '^127\.0\.0\.1:'; then
            echo 'A listener is not bound to loopback' >&2
            exit 1
          fi
          sudo test -s "$FIT_DATA_DIR/nutri.db"
          if docker compose logs app web 2>&1 | grep -E 'Traceback|"level":"error"'; then
            echo 'Containers emitted runtime errors' >&2
            exit 1
          fi
      - name: Package the tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir bundle
          docker save "everfit:$RELEASE" "everfit-web:$RELEASE" -o images.tar
          tar -xOf images.tar manifest.json | python ci/image_config.py | tee bundle/image-ids
          test "$(wc -l < bundle/image-ids)" = 2
          gzip -c images.tar > bundle/images.tar.gz
          git archive --format=tar.gz HEAD docker-compose.yml ci > bundle/release.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release
          path: bundle
          retention-days: 7
          if-no-files-found: error

  guard:
    name: Came from a pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Merged pull request into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length')
          if [ "$n" -lt 1 ]; then
            echo "::error::${{ github.sha }} reached main without a merged pull request: not deployed"
            exit 1
          fi

  deploy:
    name: Deploy
    needs: [check, guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://fit.everbright.it
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: bundle
      - name: Private data (book corpus, owner's story)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PRIVATE_DATA_REPO }}
          ssh-key: ${{ secrets.PRIVATE_DATA_KEY }}
          path: private-src
          persist-credentials: false
          sparse-checkout: |
            apps/nutritionist/corpus
            apps/nutritionist/data/story.md
          sparse-checkout-cone-mode: false
      - name: Pack the private data
        run: |
          src=private-src/apps/nutritionist
          test -s "$src/data/story.md" && test -s "$src/corpus/INDEX.md"
          umask 077
          mkdir -p private/corpus
          cp "$src/data/story.md" private/
          cp -r "$src/corpus/INDEX.md" "$src/corpus/chapters" "$src/corpus/method" "$src/corpus/tables" "$src/corpus/external" private/corpus/
          tar -czf bundle/private.tar.gz -C private .
          rm -rf private private-src
      - name: SSH configuration
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy images, release and runtime inputs
        env:
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
          FIT_OWNER_EMAIL: ${{ vars.FIT_OWNER_EMAIL }}
          NUTRI_AGENT_MODEL: ${{ vars.NUTRI_AGENT_MODEL }}
        run: |
          umask 077
          python3 ci/env.py bundle/environment.new
          ssh "$TARGET" 'install -d -m 700 /opt/everfit'
          scp bundle/release.tar.gz bundle/images.tar.gz bundle/image-ids bundle/environment.new bundle/private.tar.gz "$TARGET:/opt/everfit/"
          rm -f bundle/environment.new bundle/private.tar.gz
      - name: Deploy from versioned script
        run: ssh "$TARGET" "set -e; tar xzf /opt/everfit/release.tar.gz -C /opt/everfit ci/deploy.sh; bash /opt/everfit/ci/deploy.sh '$GITHUB_SHA'"
      - name: Public application checks
        run: python3 ci/smoke.py --url https://fit.everbright.it
