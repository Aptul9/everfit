name: everfit

# Images are built and tested in CI, shipped with docker save/load and started by tag: never built or pulled here.
services:
  app:
    image: everfit:${RELEASE:?RELEASE required}
    pull_policy: never
    environment:
      FIT_CODICE: ${FIT_CODICE:?FIT_CODICE required}
      FIT_UTENTE: ${FIT_UTENTE:-admin}
      FIT_OWNER_HASH: ${FIT_OWNER_HASH:-}
      FIT_NOME: ${FIT_UTENTE:-Admin}
      FIT_SITO: https://${FIT_DOMINIO:-fit.everbright.it}
      FIT_FUSO: Europe/Rome
      # OIDC: an incomplete configuration leaves interactive login unavailable. The legacy flag is ignored by Rust.
      FIT_OIDC_ISSUER: ${FIT_OIDC_ISSUER:-}
      FIT_OIDC_CLIENT_ID: ${FIT_OIDC_CLIENT_ID:-}
      FIT_OIDC_CLIENT_SECRET: ${FIT_OIDC_CLIENT_SECRET:-}
      FIT_OWNER_EMAIL: ${FIT_OWNER_EMAIL:-}
      FIT_LOGIN_CODICE: ${FIT_LOGIN_CODICE:-1}
    volumes:
      - ${FIT_DATA_DIR:-/opt/everfit/data}:/data
    read_only: true
    stop_grace_period: 45s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: everfit-web:${RELEASE:?RELEASE required}
    pull_policy: never
    environment:
      DOMAIN: ${FIT_DOMINIO:-fit.everbright.it}
      FIT_TLS: ${FIT_TLS:-acme}
      FIT_PERCORSO: ${FIT_PERCORSO:?FIT_PERCORSO required}
    ports:
      - 127.0.0.1:${HTTPS_PORT:-4450}:8443
    volumes:
      - certificates:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=33554432,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

volumes:
  certificates:
  caddy_config:
